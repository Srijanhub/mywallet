<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0A0E1A"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="MoneyM8"/>
  <meta name="description" content="Track expenses & sync across devices"/>
  <title>MoneyM8</title>
  <link rel="manifest" id="pwa-manifest"/>
  <link rel="apple-touch-icon" id="apple-touch-icon"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --bg:        #0A0E1A;
      --bg2:       #0F1424;
      --surface:   #141929;
      --surface2:  #1C2338;
      --border:    #242B42;
      --border2:   #2E3A55;
      --text:      #E8EDF8;
      --text2:     #8B96B3;
      --text3:     #4A5572;
      --accent:    #4F46E5;
      --accentL:   #818CF8;
      --green:     #10B981;
      --greenL:    #34D399;
      --red:       #EF4444;
      --redL:      #F87171;
      --amber:     #F59E0B;
      --safe-b:    env(safe-area-inset-bottom,0px);
      --safe-t:    env(safe-area-inset-top,0px);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:var(--bg);font-family:'Sora',sans-serif;color:var(--text);overscroll-behavior:none}
    input,button,select,textarea{font-family:inherit}
    input::-webkit-inner-spin-button{-webkit-appearance:none}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

    /* ── App shell ── */
    #app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden}

    /* ── Login screen ── */
    #login-screen{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:100%;padding:40px 32px;text-align:center;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, #1e1b4b 0%, var(--bg) 70%);
    }
    .login-logo{font-size:72px;margin-bottom:24px;filter:drop-shadow(0 0 32px #4F46E580)}
    .login-title{font-size:32px;font-weight:800;color:var(--text);margin-bottom:8px;letter-spacing:-1px}
    .login-sub{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:48px;max-width:280px}
    .login-features{display:flex;flex-direction:column;gap:12px;margin-bottom:48px;width:100%;max-width:300px}
    .login-feat{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-radius:12px;border:1px solid var(--border);text-align:left}
    .login-feat span:first-child{font-size:20px}
    .login-feat-text{font-size:12px;color:var(--text2);line-height:1.4}
    .login-feat-text strong{color:var(--text);display:block;font-size:13px;margin-bottom:2px}
    .google-btn{
      display:flex;align-items:center;justify-content:center;gap:12px;
      width:100%;max-width:300px;padding:16px 24px;
      background:#fff;color:#1a1a1a;border:none;border-radius:14px;
      font-size:15px;font-weight:700;cursor:pointer;
      box-shadow:0 4px 20px rgba(0,0,0,.4);transition:transform .15s,box-shadow .15s;
    }
    .google-btn:active{transform:scale(.97);box-shadow:0 2px 10px rgba(0,0,0,.3)}
    .google-btn img{width:20px;height:20px}
    .login-note{font-size:11px;color:var(--text3);margin-top:16px;line-height:1.6}

    /* ── Loading ── */
    #loading-screen{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:100%;gap:16px;
    }
    .spinner{width:40px;height:40px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{font-size:13px;color:var(--text2)}

    /* ── Main app ── */
    #main-app{display:flex;flex-direction:column;height:100%}
    #header{
      background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);
      padding:calc(16px + var(--safe-t)) 20px 0;
      flex-shrink:0;
    }
    #tabs{display:flex;gap:6px;padding:12px 20px;background:var(--bg);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border)}
    #content{flex:1;overflow-y:auto;padding:0 20px;padding-bottom:calc(80px + var(--safe-b))}
    #fab-container{
      position:fixed;bottom:calc(24px + var(--safe-b));
      left:max(calc(50% - 220px),16px);right:max(calc(50% - 220px),16px);
      display:flex;justify-content:flex-end;align-items:center;gap:12px;
      z-index:40;pointer-events:none;
    }
    #fab,#fab-mic{
      width:56px;height:56px;border-radius:99px;border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;font-size:26px;
      transition:transform .15s,box-shadow .15s;pointer-events:all;
    }
    #fab{
      background:linear-gradient(135deg,var(--accent),#7C3AED);
      color:#fff;box-shadow:0 8px 28px #4F46E555;
    }
    #fab:active{transform:scale(.92);box-shadow:0 4px 12px #4F46E533}
    #fab-mic{
      background:linear-gradient(135deg,#EF4444,#DC2626);
      color:#fff;box-shadow:0 8px 28px #EF444455;
    }
    #fab-mic.listening{
      background:linear-gradient(135deg,#22C55E,#16A34A);
      box-shadow:0 8px 32px #22C55E88;
      animation:voicePulse 1.2s ease-in-out infinite;
    }
    #fab-mic.processing{
      background:linear-gradient(135deg,#F59E0B,#D97706);
      box-shadow:0 6px 24px #F59E0B55;animation:none;
    }
    #fab-mic:active{transform:scale(.92)}
    #voice-toast{
      position:fixed;bottom:calc(96px + var(--safe-b));
      left:max(calc(50% - 220px),16px);right:max(calc(50% - 220px),16px);
      background:var(--surface);border:1px solid var(--border2);border-radius:16px;
      padding:14px 16px;z-index:41;box-shadow:0 8px 32px #0008;
      display:none;animation:slideUp .2s ease;
    }
    #voice-toast.visible{display:block}
    #voice-toast-status{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px}
    #voice-toast-status.listening{color:var(--green)}
    #voice-toast-status.processing{color:var(--amber)}
    #voice-toast-status.success{color:var(--green)}
    #voice-toast-status.error{color:var(--red)}
    #voice-toast-text{font-size:13px;color:var(--text);font-style:italic;line-height:1.5;min-height:20px}
    #voice-toast-result{font-size:12px;color:var(--text2);margin-top:8px;display:none}
    #voice-toast-result.visible{display:block}

    /* ── Top bar ── */
    .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .top-bar-left{}
    .app-eyebrow{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:2px}
    .app-title{font-size:22px;font-weight:800;color:var(--text);margin-top:2px;letter-spacing:-0.5px}
    .top-bar-right{display:flex;align-items:center;gap:8px}
    .user-avatar{
      width:36px;height:36px;border-radius:99px;border:2px solid var(--border2);
      overflow:hidden;display:flex;align-items:center;justify-content:center;
      background:var(--surface2);font-size:16px;cursor:pointer;flex-shrink:0;
    }
    .user-avatar img{width:100%;height:100%;object-fit:cover}
    .budget-btn{
      background:var(--surface2);border:1px solid var(--border2);border-radius:11px;
      color:var(--text2);font-size:11px;font-weight:700;padding:8px 12px;cursor:pointer;
      transition:background .15s;
    }
    .budget-btn:active{background:var(--border)}

    /* ── Stat cards ── */
    .stat-row{display:flex;gap:10px;margin-bottom:12px}
    .stat-card{
      flex:1;min-width:0;background:var(--surface);border-radius:16px;
      padding:14px 16px;border:1px solid var(--border);
    }
    .stat-label{font-size:9px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:5px;display:flex;align-items:center;gap:5px}
    .stat-value{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700}
    .stat-sub{font-size:10px;color:var(--text3);margin-top:3px}

    /* ── Remaining card ── */
    .rem-card{border-radius:18px;padding:16px 18px;margin-bottom:4px}
    .rem-label{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
    .rem-value{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:800;margin-top:4px;letter-spacing:-1px}
    .pb-meta{display:flex;justify-content:space-between;font-size:10px;color:#6B7280;margin-top:10px;margin-bottom:4px}
    .pb-bg{height:5px;background:rgba(0,0,0,.3);border-radius:99px;overflow:hidden}
    .pb-fill{height:100%;border-radius:99px;transition:width .6s ease}

    /* ── Budget warning banner ── */
    .budget-warn{
      display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;
      margin-bottom:12px;border:1px solid;animation:warnIn .25s ease;
    }
    @keyframes warnIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
    .budget-warn-icon{font-size:20px;flex-shrink:0}
    .budget-warn-text{flex:1;font-size:12px;font-weight:600;line-height:1.4}
    .budget-warn-text b{display:block;font-size:12.5px;margin-bottom:1px}

    /* ── Sync indicator ── */
    .sync-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--surface);border-radius:8px;margin-bottom:10px;border:1px solid var(--border)}
    .sync-dot{width:6px;height:6px;border-radius:99px;flex-shrink:0}
    .sync-dot.online{background:var(--green);box-shadow:0 0 6px var(--green)}
    .sync-dot.offline{background:var(--amber);box-shadow:0 0 6px var(--amber)}
    .sync-dot.syncing{background:var(--accentL);animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .sync-text{font-size:10px;color:var(--text2);font-weight:600}

    /* ── Tabs ── */
    .tab{flex:1;padding:9px 0;border-radius:11px;border:none;cursor:pointer;font-weight:700;font-size:11px;transition:background .2s,color .2s}
    .tab.active{background:var(--accent);color:#fff}
    .tab.inactive{background:var(--surface2);color:var(--text2)}

    /* ── Month nav ── */
    .month-nav{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
    .month-nav button{background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:#94A3B8;width:36px;height:36px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .15s}
    .month-nav button:active{background:var(--border)}
    .month-nav .title{font-weight:800;font-size:16px;color:var(--text)}

    /* ── Calendar ── */
    .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
    .cal-dow span{text-align:center;font-size:9px;color:var(--text3);font-weight:700;letter-spacing:.5px;padding:3px 0}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:18px}
    .cal-cell{
      aspect-ratio:1;border-radius:11px;border:1px solid transparent;
      cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-size:12px;font-weight:600;color:#CBD5E1;background:var(--surface);transition:all .15s;
    }
    .cal-cell.empty{background:transparent;cursor:default;border-color:transparent}
    .cal-cell.today{color:var(--accentL);font-weight:800;background:var(--surface2)}
    .cal-cell.selected{border-color:var(--accent);background:#4F46E522;color:var(--accentL)}
    .cal-cell:active:not(.empty){transform:scale(.9)}
    .cal-dots{display:flex;gap:2px;margin-top:2px}
    .dot{width:5px;height:5px;border-radius:99px}

    /* ── Day panel ── */
    .day-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .day-title{font-size:14px;font-weight:700;color:var(--text)}
    .day-sub{font-size:11px;color:var(--text2);font-weight:500;margin-left:7px}
    .add-btn{background:var(--accent);border:none;border-radius:10px;color:#fff;font-weight:700;font-size:12px;padding:8px 14px;cursor:pointer;transition:opacity .15s}
    .add-btn:active{opacity:.8}
    .empty-state{text-align:center;color:var(--text3);font-size:13px;padding:28px 0;line-height:2}

    /* ── Entry row ── */
    .entry-row{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:13px;background:var(--surface2);border:1px solid var(--border);margin-bottom:7px;transition:opacity .2s}
    .entry-icon{width:36px;height:36px;border-radius:10px;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .entry-info{flex:1;min-width:0}
    .entry-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .entry-cat{font-size:10px;color:var(--text3);margin-top:2px}
    .entry-amt{text-align:right;flex-shrink:0}
    .entry-val{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace}
    .entry-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:10px;padding:0;margin-top:3px;display:block;transition:color .15s}
    .entry-del:hover{color:var(--red)}

    /* ── Summary ── */
    .s-card{background:var(--surface2);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid var(--border)}
    .s-card-title{font-size:10px;font-weight:700;color:var(--text2);margin-bottom:14px;text-transform:uppercase;letter-spacing:1px}
    .s-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
    .s-row:last-child{border-bottom:none}
    .s-label{font-size:13px;color:var(--text2)}
    .s-val{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace}
    .cb-row{margin-bottom:12px}
    .cb-hdr{display:flex;justify-content:space-between;margin-bottom:5px}
    .cb-bg{height:5px;background:var(--border);border-radius:99px;overflow:hidden}
    .cb-fill{height:100%;border-radius:99px;transition:width .6s ease}

    /* ── Modal ── */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(6px)}
    .modal{
      background:var(--surface);border-radius:24px 24px 0 0;
      padding:20px 22px calc(20px + var(--safe-b));
      width:100%;max-width:480px;max-height:92vh;overflow-y:auto;
      animation:slideUp .28s cubic-bezier(.32,.72,0,1);
    }
    @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal-handle{width:36px;height:4px;background:var(--border2);border-radius:99px;margin:0 auto 18px}
    .modal-title{font-size:17px;font-weight:800;color:var(--text);margin-bottom:18px;letter-spacing:-.3px}
    .type-toggle{display:flex;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:16px;gap:4px}
    .type-btn{flex:1;padding:10px 0;border-radius:9px;border:none;cursor:pointer;font-weight:700;font-size:13px;transition:all .2s}
    .f-label{font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:1.2px;display:block;margin-bottom:7px}
    .f-input{
      width:100%;background:var(--surface2);border:1px solid var(--border2);
      border-radius:11px;padding:12px 14px;color:var(--text);font-size:14px;
      outline:none;transition:border-color .2s;margin-bottom:14px;
    }
    .f-input:focus{border-color:var(--accent)}
    .f-input.large{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace}
    .cat-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
    .cat-chip{padding:6px 12px;border-radius:99px;cursor:pointer;font-size:11px;font-weight:700;transition:all .15s;border:1px solid transparent}
    .btn-row{display:flex;gap:10px}
    .btn-cancel{flex:1;padding:13px 0;border-radius:13px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-weight:700;font-size:14px}
    .btn-save{flex:2;padding:13px 0;border-radius:13px;border:none;color:#fff;cursor:pointer;font-weight:800;font-size:15px;transition:transform .1s,opacity .1s}
    .btn-save:active{transform:scale(.97);opacity:.9}

    /* ── User menu ── */
    .user-menu{
      position:fixed;top:calc(60px + var(--safe-t));right:max(calc(50% - 220px),16px);
      background:var(--surface);border:1px solid var(--border2);border-radius:16px;
      padding:6px;z-index:300;box-shadow:0 12px 40px #0008;min-width:220px;
      animation:fadeIn .15s ease;
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
    .um-user{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
    .um-avatar{width:36px;height:36px;border-radius:99px;overflow:hidden;flex-shrink:0}
    .um-avatar img{width:100%;height:100%;object-fit:cover}
    .um-name{font-size:13px;font-weight:700;color:var(--text)}
    .um-email{font-size:10px;color:var(--text2)}
    .um-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--redL);cursor:pointer;font-size:13px;font-weight:700;transition:background .15s}
    .um-btn:hover{background:var(--surface2)}

    /* ── Offline banner ── */
    #offline-banner{display:none;position:fixed;top:0;left:0;right:0;background:var(--amber);color:#000;font-size:12px;font-weight:700;text-align:center;padding:8px;z-index:999}

    /* ── Voice input ── */
    .voice-section{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 6px}
    .voice-btn{width:72px;height:72px;border-radius:99px;border:none;cursor:pointer;background:linear-gradient(135deg,#EF4444,#DC2626);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 24px #EF444455;transition:transform .15s,box-shadow .15s}
    .voice-btn.listening{background:linear-gradient(135deg,#22C55E,#16A34A);box-shadow:0 6px 32px #22C55E88;animation:voicePulse 1.2s ease-in-out infinite}
    .voice-btn.processing{background:linear-gradient(135deg,#F59E0B,#D97706);box-shadow:0 6px 24px #F59E0B55}
    @keyframes voicePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
    .voice-btn:active:not(.listening){transform:scale(.92)}
    .voice-status{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.5px;min-height:18px;text-align:center}
    .voice-status.listening{color:var(--green)}
    .voice-status.processing{color:var(--amber)}
    .voice-status.error{color:var(--red)}
    .voice-transcript{background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--text);width:100%;min-height:44px;display:none;margin-top:4px;font-style:italic;line-height:1.5}
    .voice-transcript.visible{display:block}
    .voice-divider{display:flex;align-items:center;gap:10px;width:100%;margin:6px 0}
    .voice-divider span{font-size:11px;color:var(--text3);font-weight:600;white-space:nowrap}
    .voice-divider::before,.voice-divider::after{content:'';flex:1;height:1px;background:var(--border)}

    /* ── Install banner ── */
    #install-banner{
      display:none;position:fixed;
      bottom:calc(90px + var(--safe-b));left:max(calc(50% - 220px),16px);right:max(calc(50% - 220px),16px);
      background:var(--surface);border:1px solid var(--accent);border-radius:16px;
      padding:14px 16px;z-index:300;box-shadow:0 12px 40px #0008;
    }
    #install-banner p{font-size:13px;color:var(--text);margin-bottom:10px;font-weight:600}
    .ib-row{display:flex;gap:8px}
    .ib-row button{flex:1;padding:9px 0;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:13px}
    #install-yes{background:var(--accent);color:#fff}
    #install-no{background:var(--surface2);color:var(--text2)}
  </style>
</head>
<body>

<div id="offline-banner">⚠️ You're offline — showing cached data</div>
<div id="install-banner">
  <p>📲 Install MoneyM8 on your home screen</p>
  <div class="ib-row">
    <button id="install-yes">Install</button>
    <button id="install-no">Later</button>
  </div>
</div>

<div id="app">
  <!-- Screens injected by JS -->
</div>
<div id="modal-root"></div>

<!-- Firebase SDKs -->
<script type="module">

const SW = `
const CACHE='moneym8-v3';
const CORE=['./',location.href];
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)));self.skipWaiting()});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim()});
self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res.ok){const c=res.clone();caches.open(CACHE).then(ch=>ch.put(e.request,c))}return res}).catch(()=>caches.match('./'))))});
`;
if('serviceWorker' in navigator){
  const swBlob = new Blob([SW],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(swBlob),{scope:'./'}).catch(()=>{});
}

const CATS={
  Food:     {icon:'🍔',color:'#F97316'},Transport:{icon:'🚗',color:'#3B82F6'},
  Shopping: {icon:'🛍️',color:'#A855F7'},Health:   {icon:'💊',color:'#10B981'},

let state={

  user:null,
  curY:now.getFullYear(),curM:now.getMonth(),selDay:now.getDate(),
  view:'calendar',
  entries:[],
  budget:0,
  budgetAlertPct:80,
  syncStatus:'online', // online | offline | syncing
  showUserMenu:false,
  warnDismissed:false,
};
let unsubEntries=null, unsubBudget=null;

function setState(patch){Object.assign(state,patch);render()}

// ── Firestore helpers ──────────────────────────────────────────────────────
function entriesCol(uid){return collection(db,`users/${uid}/entries`)}
function budgetDoc(uid){return doc(db,`users/${uid}/settings/budget`)}

async function saveEntry(entry){
  if(!state.user)return;
  setState({syncStatus:'syncing'});
  try{
    await setDoc(doc(entriesCol(state.user.uid),String(entry.id)),entry);
    setState({syncStatus:'online'});
  }catch(e){setState({syncStatus:'offline'})}
}
async function removeEntry(id){
  if(!state.user)return;
  setState({syncStatus:'syncing'});
  try{
    await deleteDoc(doc(entriesCol(state.user.uid),String(id)));
    setState({syncStatus:'online'});
  }catch(e){setState({syncStatus:'offline'})}
}
async function saveBudget(val,alertPct){
  if(!state.user)return;
  try{await setDoc(budgetDoc(state.user.uid),{value:val,alertPct:alertPct??80})}catch(e){}
}

function subscribeUser(uid){
  if(unsubEntries)unsubEntries();
  if(unsubBudget)unsubBudget();

  unsubEntries=onSnapshot(collection(db,`users/${uid}/entries`),snap=>{
    state.entries=snap.docs.map(d=>d.data());
    render();
  },()=>{});

  unsubBudget=onSnapshot(budgetDoc(uid),snap=>{
    state.budget=snap.exists()?(snap.data().value||0):0;
    state.budgetAlertPct=snap.exists()?(snap.data().alertPct||80):80;
    render();
  },()=>{});
}

// ── Auth ───────────────────────────────────────────────────────────────────
onAuthStateChanged(auth,async user=>{
  if(user){
    state.user=user;
    subscribeUser(user.uid);
    setState({screen:'main'});
  } else {
    if(unsubEntries){unsubEntries();unsubEntries=null}
    if(unsubBudget){unsubBudget();unsubBudget=null}
    setState({screen:'login',user:null,entries:[],budget:0});
  }
});

    }
  }
}

// ── Derived ────────────────────────────────────────────────────────────────
function monthEntries(){return state.entries.filter(e=>e.date&&e.date.y===state.curY&&e.date.m===state.curM)}
function dayEntries(d){return monthEntries().filter(e=>e.date.d===d)}
function dayNet(d){
  const es=dayEntries(d);
  return{
    inc:es.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0),
    exp:es.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0),
    inv:es.filter(e=>e.type==='investment').reduce((s,e)=>s+e.amount,0),
    count:es.length
  };
}
function totals(){
  const me=monthEntries();
  const inc=me.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
  const exp=me.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0);
  const inv=me.filter(e=>e.type==='investment').reduce((s,e)=>s+e.amount,0);
  return{inc,exp,inv,net:inc-exp};
}

// ── DOM helpers ───────────────────────────────────────────────────────────
function el(tag,attrs,...children){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else e.setAttribute(k,v);
  });
  children.flat().forEach(c=>{if(c!=null)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});
  return e;
}
function div(cls,style,...children){return el('div',{class:cls||'',style:style||{}},...children)}

// ── Entry row ─────────────────────────────────────────────────────────────
function entryRowEl(entry){
  const cat=CATS[entry.category]||CATS.Other;
  const isInc=entry.type==='income';
  const isInv=entry.type==='investment';
  const amtColor=isInc?'#22C55E':isInv?'#818CF8':'#F87171';
  const amtSign=isInc?'+':isInv?'↗':'−';
  const typeTag=isInv?el('span',{style:{marginLeft:'6px',fontSize:'9px',background:'#818CF822',color:'#818CF8',border:'1px solid #818CF844',borderRadius:'99px',padding:'1px 6px',fontWeight:'700'}},'INVEST'):'';
  return div('entry-row',null,
    div('entry-icon',{background:cat.color+'22'},cat.icon),
    div('entry-info',null,
      div('entry-name',null,entry.label||entry.category),
      el('div',{class:'entry-cat',style:{display:'flex',alignItems:'center',gap:'4px'}},entry.category,typeTag)
    ),
    div('entry-amt',null,
      el('div',{class:'entry-val',style:{color:amtColor}},amtSign+fmt(entry.amount)),
      el('button',{class:'entry-del',onClick:()=>removeEntry(entry.id)},'✕ remove')
    )
  );
}

  const rawPct=state.budget?(exp/state.budget)*100:0;
  const pos=remaining>=0;
  const u=state.user;

  const hdr=document.createElement('div');

  // Top bar
  const topBar=div('top-bar',null,
    div('top-bar-left',null,
      el('div',{class:'app-eyebrow'},'Expense Tracker'),

  // Budget warning banner

        ),
        el('button',{style:{background:'none',border:'none',color:'#FCA5A5',fontSize:'16px',cursor:'pointer',flexShrink:'0'},onClick:()=>setState({warnDismissed:true})},'✕')
      );

        el('span',{class:'budget-warn-icon'},'⚠️'),
        div('budget-warn-text',{color:'#FCD34D'},
          el('b',null,`You've used ${rawPct.toFixed(0)}% of your budget`),

        ),
        el('button',{style:{background:'none',border:'none',color:'#FCD34D',fontSize:'16px',cursor:'pointer',flexShrink:'0'},onClick:()=>setState({warnDismissed:true})},'✕')
      );
    }

  // Stats
  const statRow=div('',{display:'flex',gap:'8px',marginBottom:'12px',overflowX:'auto',paddingBottom:'2px'});
  [{label:'Earned',val:inc,color:'#22C55E',icon:'💵',type:'income'},

   {label:'Invested',val:inv,color:'#818CF8',icon:'📈',type:'investment'},

    c.innerHTML=`<div class="stat-label"><span>${icon}</span> ${label}</div><div class="stat-value" style="color:${color}">${fmt(val)}</div><div class="stat-sub">${monthEntries().filter(e=>e.type===t).length} entries</div>`;

function renderCalendar(container){
  const{curY,curM,selDay}=state;
  const dim=new Date(curY,curM+1,0).getDate();
  const fdow=new Date(curY,curM,1).getDay();
  const todD=now.getDate(),todM=now.getMonth(),todY=now.getFullYear();

  container.appendChild(monthNavEl());

  const dow=div('cal-dow');
  DAYS.forEach(d=>dow.appendChild(el('span',null,d)));
  container.appendChild(dow);

  const grid=div('cal-grid');
  for(let i=0;i<fdow;i++)grid.appendChild(div('cal-cell empty'));
  for(let d=1;d<=dim;d++){
    const{inc,exp,inv,count}=dayNet(d);
    const isToday=d===todD&&curM===todM&&curY===todY;
    const isSel=d===selDay;
    let cls='cal-cell'+(isToday?' today':'')+(isSel?' selected':'');
    const cell=el('button',{class:cls,onClick:()=>setState({selDay:d})},el('span',null,String(d)));
    if(count>0){
      const dots=div('cal-dots');
      if(exp>0)dots.appendChild(div('dot',{background:'#EF4444'}));
      if(inc>0)dots.appendChild(div('dot',{background:'#22C55E'}));
      if(inv>0)dots.appendChild(div('dot',{background:'#818CF8'}));
      cell.appendChild(dots);
    }
    grid.appendChild(cell);
  }
  container.appendChild(grid);

  const des=dayEntries(selDay);
  container.appendChild(div('day-hdr',null,
    el('div',null,
      el('span',{class:'day-title'},MONTHS[curM]+' '+selDay+', '+curY),
      el('span',{class:'day-sub'},des.length+' entr'+(des.length===1?'y':'ies'))
    ),
    el('button',{class:'add-btn',onClick:()=>setState({modal:'add'})},'+ Add')
  ));

  if(des.length===0)container.appendChild(el('div',{class:'empty-state'},'No entries for this day.\nTap + Add to log one.'));
  else des.forEach(e=>container.appendChild(entryRowEl(e)));
}

function renderAddModal(){
  let type='expense',amount='',label='',category='Food';
  const{curY,curM,selDay}=state;
  const overlay=div('overlay',{onClick:e=>{if(e.target===overlay)closeModal()}});
  const modal=div('modal');

  const amtInput=el('input',{class:'f-input large',type:'number',placeholder:'0.00',min:'0',step:'0.01'});
  amtInput.addEventListener('input',e=>amount=e.target.value);
  const lblInput=el('input',{class:'f-input',type:'text',placeholder:'e.g. Lunch, Salary...'});

  const toggleWrap=div('type-toggle');
  const catWrap=div('cat-chips');
  const saveBtn=el('button',{class:'btn-save',style:{background:'#EF4444'},onClick:()=>{
    if(!type)type='expense';
    const n=parseFloat(amtInput.value);
    if(!n||n<=0){amtInput.style.borderColor='#EF4444';return}
    const entry={id:Date.now(),type,amount:n,label:lblInput.value,category,date:{y:curY,m:curM,d:selDay}};
    saveEntry(entry);
    closeModal();
  }},'Save Entry');

  const TYPE_CFG={
    expense:{label:'💸 Expense',color:'#EF4444',defCat:'Food'},
    income:{label:'💵 Income',color:'#22C55E',defCat:'Income'},
    investment:{label:'📈 Investment',color:'#6366F1',defCat:'Savings'},
  };
  const updateToggle=()=>{
    toggleWrap.innerHTML='';
    Object.entries(TYPE_CFG).forEach(([t,cfg])=>{
      const active=type===t;
      const b=el('button',{class:'type-btn',style:{background:active?cfg.color:'transparent',color:active?'#fff':'var(--text2)',fontSize:'11px'},
        onClick:()=>{type=t;category=cfg.defCat;updateToggle();updateCats();saveBtn.style.background=cfg.color;}
      },cfg.label);
      toggleWrap.appendChild(b);
    });
  };
  const updateCats=()=>{
    catWrap.innerHTML='';
    Object.entries(CATS).forEach(([k,v])=>{
      const show=type==='income'?['Income','Savings','Other'].includes(k):
             type==='investment'?['Savings','Other','Housing'].includes(k)||CATS[k]?.custom:
             k!=='Income';
      if(!show)return;
      const chip=el('button',{class:'cat-chip',style:{background:category===k?v.color+'33':'var(--surface2)',borderColor:category===k?v.color:'var(--border2)',color:category===k?v.color:'var(--text2)'},onClick:()=>{category=k;updateCats()}},v.icon+' '+k);
      catWrap.appendChild(chip);
    });
  };
  updateToggle();updateCats();

  // ── Voice input section ──
  const voiceSection = div('voice-section');
  const voiceBtn = el('button',{class:'voice-btn'},'🎤');
  const voiceStatus = el('div',{class:'voice-status'},'Tap to speak your expenses');
  const voiceTranscript = el('div',{class:'voice-transcript'});
  voiceSection.append(voiceBtn, voiceStatus, voiceTranscript);

  // Spoken number converter
  const ONES_MAP = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,a:1,won:1,to:2,too:2,fore:4,ate:8};
  const TENS_MAP = {twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
  const MULT_MAP = {hundred:100,thousand:1000,lakh:100000,lac:100000,million:1000000,crore:10000000};
  function convertSpokenNums(text){
    const tokens=text.toLowerCase().split(/\s+/);
    const out=[];let i=0;
    while(i<tokens.length){
      const tok=tokens[i];
      if(ONES_MAP[tok]!==undefined||TENS_MAP[tok]!==undefined||tok==='hundred'||MULT_MAP[tok]!==undefined){
        const numToks=[];let j=i;
        while(j<tokens.length){
          const t=tokens[j];
          if(ONES_MAP[t]!==undefined||TENS_MAP[t]!==undefined||t==='hundred'||MULT_MAP[t]!==undefined||t==='point'||t==='dot'){numToks.push(t);j++;}
          else break;
        }
        let total=0,current=0;
        for(let k=0;k<numToks.length;k++){
          const w=numToks[k];
          if(ONES_MAP[w]!==undefined)current+=ONES_MAP[w];
          else if(TENS_MAP[w]!==undefined)current+=TENS_MAP[w];
          else if(w==='hundred')current=(current||1)*100;
          else if(MULT_MAP[w]!==undefined){current=(current||1)*MULT_MAP[w];total+=current;current=0;}
          else if((w==='point'||w==='dot')&&numToks[k+1]){total+=current+parseFloat('0.'+( ONES_MAP[numToks[k+1]]??numToks[k+1]));current=0;k++;}
        }
        total+=current;
        if(total>0){out.push(String(total));i=j;}
        else{out.push(tok);i++;}
      } else {out.push(tok);i++;}
    }
    return out.join(' ');
  }

  // Parse voice transcript into form fields
  function parseVoiceIntoForm(transcript){
    const converted = convertSpokenNums(transcript);
    // Try to find amount
    const amtMatch = converted.match(/(\d+(?:\.\d+)?)/);
    if(amtMatch){
      amtInput.value = amtMatch[1];
      amount = parseFloat(amtMatch[1]);
      amtInput.style.borderColor = 'var(--accent)';
    }
    // Try to find category
    const lower = converted.toLowerCase();
    const catKeys = Object.keys(CATS);
    const EXTRA_MAP = {uber:'Transport',ola:'Transport',taxi:'Transport',cab:'Transport',petrol:'Transport',fuel:'Transport',
      groceries:'Food',lunch:'Food',dinner:'Food',breakfast:'Food',coffee:'Food',restaurant:'Food',
      salary:'Income',sal:'Income',income:'Income',earned:'Income',bonus:'Income',freelance:'Income',
      medicine:'Health',doctor:'Health',hospital:'Health',pharmacy:'Health',medicines:'Health',
      electricity:'Bills',rent:'Housing',wifi:'Bills',internet:'Bills',recharge:'Bills',
      movie:'Fun',movies:'Fun',game:'Fun',games:'Fun',party:'Fun',
      investment:'Savings',invest:'Savings',mutual:'Savings','mutual funds':'Savings',sip:'Savings',};
    let matched = null;
    // Check extra map first
    for(const[word,cat] of Object.entries(EXTRA_MAP)){
      if(lower.includes(word)){matched=cat;break;}
    }
    // Then check actual category names
    if(!matched){
      for(const k of catKeys){
        if(lower.includes(k.toLowerCase())){matched=k;break;}
      }
    }
    // Detect type from keywords
    const incomeWords = ['salary','income','earned','received','bonus','freelance','stipend','got paid'];
    const investWords = ['mutual fund','sip','invest','stock','share','crypto','fd','fixed deposit','gold','nps','ppf','dividend'];
    const isIncome = incomeWords.some(w=>lower.includes(w));
    const isInvest = investWords.some(w=>lower.includes(w));
    if(isIncome){type='income';matched=matched||'Income';}
    else if(isInvest){type='investment';matched=matched||'Savings';}
    else{type='expense';}

    if(matched&&CATS[matched]){
      category=matched;
    }
    // Extract label: everything that's not a number or category keyword
    const withoutNum = converted.replace(/\d+(?:\.\d+)?/g,'').trim();
    const label_guess = withoutNum.replace(/spent|paid|bought|received|earned|got|on|for|to|the|a|an/gi,'').trim();
    if(label_guess.length>1&&label_guess.length<40){
      lblInput.value = label_guess.charAt(0).toUpperCase()+label_guess.slice(1);
    }
    updateToggle();
    updateCats();
    saveBtn.style.background = type==='income'?'#22C55E':type==='investment'?'#6366F1':'#EF4444';
  }

  let recognition = null;
  let isListening = false;

  function startVoice(){
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition){
      voiceStatus.textContent = '❌ Voice not supported in this browser';
      voiceStatus.className = 'voice-status error';
      return;
    }
    recognition = new SpeechRecognition();
    recognition.lang = 'en-IN';
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isListening = true;
      voiceBtn.className = 'voice-btn listening';
      voiceBtn.textContent = '⏹';
      voiceStatus.textContent = '🎤 Listening... speak now';
      voiceStatus.className = 'voice-status listening';
      voiceTranscript.className = 'voice-transcript';
      voiceTranscript.textContent = '';
    };
    recognition.onresult = (e) => {
      let interim = '', final = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal)final+=e.results[i][0].transcript;
        else interim+=e.results[i][0].transcript;
      }
      voiceTranscript.className = 'voice-transcript visible';
      voiceTranscript.textContent = final||interim;
      if(final){
        voiceBtn.className = 'voice-btn processing';
        voiceBtn.textContent = '⏳';
        voiceStatus.textContent = '✨ Processing...';
        voiceStatus.className = 'voice-status processing';
        setTimeout(()=>{
          parseVoiceIntoForm(final);
          voiceBtn.className = 'voice-btn';
          voiceBtn.textContent = '🎤';
          voiceStatus.textContent = '✅ Done! Check fields below';
          voiceStatus.className = 'voice-status';
          isListening = false;
        },400);
      }
    };
    recognition.onerror = (e) => {
      voiceBtn.className = 'voice-btn';
      voiceBtn.textContent = '🎤';
      isListening = false;
      if(e.error==='no-speech'){
        voiceStatus.textContent = 'No speech detected. Try again.';
      } else if(e.error==='not-allowed'){
        voiceStatus.textContent = '❌ Mic permission denied. Allow in browser settings.';
        voiceStatus.className = 'voice-status error';
      } else {
        voiceStatus.textContent = '❌ Error: '+e.error+'. Try again.';
        voiceStatus.className = 'voice-status error';
      }
    };
    recognition.onend = () => {
      if(isListening){
        voiceBtn.className = 'voice-btn';
        voiceBtn.textContent = '🎤';
        isListening = false;
      }
    };
    recognition.start();
  }

  voiceBtn.addEventListener('click', ()=>{
    if(isListening){recognition&&recognition.stop();}
    else{startVoice();}
  });

  const divider = div('voice-divider',null, el('span',null,'or fill manually'));

  modal.append(
    div('modal-handle'),
    el('div',{class:'modal-title'},'📝 Log Entry — '+MONTHS[curM]+' '+selDay),
    voiceSection,
    divider,
    toggleWrap,
    el('label',{class:'f-label'},'Amount (₹)'),amtInput,
    el('label',{class:'f-label'},'Description'),lblInput,
    el('label',{class:'f-label'},'Category'),catWrap,
    div('btn-row',null,
      el('button',{class:'btn-cancel',onClick:closeModal},'Cancel'),
      saveBtn
    )
  );
  overlay.appendChild(modal);
  document.getElementById('modal-root').appendChild(overlay);
  setTimeout(()=>amtInput.focus(),300);
}

  const modal=div('modal');
  const inp=el('input',{class:'f-input large',type:'number',placeholder:'e.g. 20000',min:'0'});
  inp.value=state.budget||'';

  const alertInp=el('input',{class:'f-input',type:'number',placeholder:'80',min:'1',max:'100'});
  alertInp.value=state.budgetAlertPct||80;

  modal.append(
    div('modal-handle'),
    el('div',{class:'modal-title'},'📊 Monthly Budget'),
    el('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'18px'}},"Set a limit. Leave 0 to use your income as baseline. You'll get a warning banner once you cross the threshold below."),
    el('label',{class:'f-label'},'Budget Amount (₹)'),inp,
    el('label',{class:'f-label'},'Warn me when spending reaches (%)'),alertInp,
    div('btn-row',null,
      el('button',{class:'btn-cancel',onClick:closeModal},'Cancel'),
      el('button',{class:'btn-save',style:{background:'var(--accent)'},onClick:()=>{
        const v=parseFloat(inp.value)||0;
        const a=Math.min(Math.max(parseFloat(alertInp.value)||80,1),100);
        saveBudget(v,a);setState({budget:v,budgetAlertPct:a,modal:null,warnDismissed:false});
      }},'Set Budget')
    )
  );
  overlay.appendChild(modal);
  document.getElementById('modal-root').appendChild(overlay);
}

function renderUserMenu(){

      if(u?.photoURL)av.appendChild(el('img',{src:u.photoURL,alt:'avatar'}));

    )

function closeModal(){
  document.getElementById('modal-root').innerHTML='';
  state.modal=null;
}

// ── Main render ───────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  const modalRoot=document.getElementById('modal-root');

  // Screens
  if(state.screen==='loading'){
    app.innerHTML='';app.appendChild(renderLoading());
    modalRoot.innerHTML='';return;
  }
  if(state.screen==='login'){
    app.innerHTML='';app.appendChild(renderLogin());
    modalRoot.innerHTML='';return;
  }

  // Main app
  // Check if we need full rebuild or just content
  let mainApp=app.querySelector('#main-app');
  if(!mainApp){
    app.innerHTML='';
    mainApp=el('div',{id:'main-app'});
    app.appendChild(mainApp);
  }

  // Header
  const oldHdr=mainApp.querySelector('#header');
  const newHdr=renderHeader();
  if(oldHdr)mainApp.replaceChild(newHdr,oldHdr);
  else mainApp.insertBefore(newHdr,mainApp.firstChild);

  // Tabs
  const oldTabs=mainApp.querySelector('#tabs');
  const newTabs=renderTabs();
  if(oldTabs)mainApp.replaceChild(newTabs,oldTabs);
  else{const hdr=mainApp.querySelector('#header');mainApp.insertBefore(newTabs,hdr?.nextSibling||null)}

  // Content
  let content=mainApp.querySelector('#content');
  if(!content){
    content=el('div',{id:'content'});
    mainApp.appendChild(content);
  }
  content.innerHTML='';
  if(state.view==='calendar')renderCalendar(content);
  else if(state.view==='list')renderLog(content);
  else renderSummary(content);

  // FAB container — appended to document.body so it's never wiped by app.innerHTML=''
  if(!document.getElementById('fab-container')){
    const fabContainer=el('div',{id:'fab-container'});
    const fabMic=el('button',{id:'fab-mic',title:'Speak to log expenses'});
    fabMic.textContent='🎤';
    const fab=el('button',{id:'fab',onClick:()=>setState({modal:'add'})});
    fab.textContent='+';
    fabContainer.appendChild(fabMic);
    fabContainer.appendChild(fab);
    document.body.appendChild(fabContainer);
    // Toast
    const toast=el('div',{id:'voice-toast'});
    toast.innerHTML=`<div id="voice-toast-status"></div><div id="voice-toast-text"></div><div id="voice-toast-result"></div>`;
    document.body.appendChild(toast);
    initFabMic(fabMic);
  }

  // Modals
  modalRoot.innerHTML='';
  if(state.modal==='add')renderAddModal();
  if(state.modal==='budget')renderBudgetModal();
  if(state.showUserMenu)modalRoot.appendChild(renderUserMenu());
}

// ── FAB Mic: voice → auto-log ─────────────────────────────────────────────
const SPOKEN_ONES={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,a:1,won:1,to:2,too:2,fore:4,ate:8};
const SPOKEN_TENS={twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
const SPOKEN_MULT={hundred:100,thousand:1000,lakh:100000,lac:100000,million:1000000,crore:10000000};

function spokenToNumber(tokens){
  let total=0,current=0;
  for(let k=0;k<tokens.length;k++){
    const w=tokens[k];
    if(SPOKEN_ONES[w]!==undefined)current+=SPOKEN_ONES[w];
    else if(SPOKEN_TENS[w]!==undefined)current+=SPOKEN_TENS[w];
    else if(w==='hundred')current=(current||1)*100;
    else if(SPOKEN_MULT[w]!==undefined){current=(current||1)*SPOKEN_MULT[w];total+=current;current=0;}
  }
  return total+current||null;
}

function convertSpokenToDigits(text){
  const tokens=text.toLowerCase().split(/\s+/);
  const out=[];let i=0;
  while(i<tokens.length){
    const tok=tokens[i];
    if(SPOKEN_ONES[tok]!==undefined||SPOKEN_TENS[tok]!==undefined||tok==='hundred'||SPOKEN_MULT[tok]!==undefined){
      const numToks=[];let j=i;
      while(j<tokens.length){
        const t=tokens[j];
        if(SPOKEN_ONES[t]!==undefined||SPOKEN_TENS[t]!==undefined||t==='hundred'||SPOKEN_MULT[t]!==undefined){numToks.push(t);j++;}
        else break;
      }
      const num=spokenToNumber(numToks);
      if(num&&num>0){out.push(String(num));i=j;}
      else{out.push(tok);i++;}
    } else{out.push(tok);i++;}
  }
  return out.join(' ');
}

const VOICE_CAT_MAP={
  uber:'Transport',ola:'Transport',taxi:'Transport',cab:'Transport',auto:'Transport',
  petrol:'Transport',fuel:'Transport',metro:'Transport',bus:'Transport',train:'Transport',
  groceries:'Food',grocery:'Food',lunch:'Food',dinner:'Food',breakfast:'Food',
  coffee:'Food',restaurant:'Food',food:'Food',snack:'Food',swiggy:'Food',zomato:'Food',
  salary:'Income',income:'Income',earned:'Income',bonus:'Income',freelance:'Income',stipend:'Income',
  medicine:'Health',doctor:'Health',hospital:'Health',pharmacy:'Health',medicines:'Health',
  electricity:'Bills',wifi:'Bills',internet:'Bills',recharge:'Bills',phone:'Bills',
  movie:'Fun',movies:'Fun',game:'Fun',games:'Fun',party:'Fun',outing:'Fun',
  rent:'Housing',maintenance:'Housing',
  'mutual fund':'Savings',sip:'Savings',stock:'Savings',shares:'Savings',
  crypto:'Savings',fd:'Savings',gold:'Savings',nps:'Savings',ppf:'Savings',
};
const INVEST_WORDS=['mutual fund','sip','stock','share','crypto','fd','fixed deposit','gold','nps','ppf','bond','invest'];
const INCOME_WORDS=['salary','income','earned','received','bonus','freelance','stipend','got paid'];

function parseVoiceQuick(text){
  const converted=convertSpokenToDigits(text);
  const lower=converted.toLowerCase();
  const amtMatch=converted.match(/(\d+(?:\.\d+)?)/);
  if(!amtMatch)return null;
  const amount=parseFloat(amtMatch[1]);

  // Detect type
  const isIncome=INCOME_WORDS.some(w=>lower.includes(w));
  const isInvest=INVEST_WORDS.some(w=>lower.includes(w));
  const type=isIncome?'income':isInvest?'investment':'expense';

  // Detect category
  let category=type==='income'?'Income':type==='investment'?'Savings':'Other';
  for(const[word,cat] of Object.entries(VOICE_CAT_MAP)){
    if(lower.includes(word)){category=cat;break;}
  }

  // Build label: strip numbers and common filler words
  const label=converted
    .replace(/\d+(?:\.\d+)?/g,'')
    .replace(/(spent|paid|for|on|the|a|an|i|me|my)/gi,'')
    .trim()
    .replace(/\s+/g,' ')
    .slice(0,40)||category;

  return{amount,type,category,label:label.charAt(0).toUpperCase()+label.slice(1)};
}

function showToast(status,text,result){
  const toast=document.getElementById('voice-toast');
  const statusEl=document.getElementById('voice-toast-status');
  const textEl=document.getElementById('voice-toast-text');
  const resultEl=document.getElementById('voice-toast-result');
  if(!toast)return;
  toast.className='visible';
  statusEl.className=status;
  statusEl.textContent=
    status==='listening'?'🎤 Listening... speak now':
    status==='processing'?'⏳ Processing...':
    status==='success'?'✅ Saved!':
    status==='error'?'❌ Error':'';
  textEl.textContent=text||'';
  if(result){resultEl.className='visible';resultEl.textContent=result;}
  else{resultEl.className='';resultEl.textContent='';}
  if(status==='success'||status==='error'){
    setTimeout(()=>{toast.className='';},3000);
  }
}

function initFabMic(btn){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    btn.style.display='none'; // hide if not supported
    return;
  }
  let recognition=null;
  let listening=false;

  btn.addEventListener('click',()=>{
    if(listening){
      recognition&&recognition.stop();
      listening=false;
      btn.className='';
      btn.textContent='🎤';
      document.getElementById('voice-toast').className='';
      return;
    }
    recognition=new SpeechRecognition();
    recognition.lang='en-IN';
    recognition.continuous=false;
    recognition.interimResults=true;
    recognition.maxAlternatives=3;

    recognition.onstart=()=>{
      listening=true;
      btn.className='listening';
      btn.textContent='⏹';
      showToast('listening','Say your expense — e.g. "200 food" or "5000 salary"');
    };

    recognition.onresult=(e)=>{
      let interim='',final='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal)final+=e.results[i][0].transcript;
        else interim+=e.results[i][0].transcript;
      }
      if(interim)showToast('listening',interim);
      if(final){
        btn.className='processing';
        btn.textContent='⏳';
        showToast('processing',final);
        listening=false;

        setTimeout(async()=>{
          const parsed=parseVoiceQuick(final);
          if(!parsed||!parsed.amount){
            btn.className='';btn.textContent='🎤';
            showToast('error',`Couldn't understand "${final}". Try again.`);
            return;
          }

          // Auto-save directly to Firebase
          try{
            const today=new Date();
            const entry={
              id:Date.now()+Math.floor(Math.random()*9999),
              type:parsed.type,
              amount:parsed.amount,
              label:parsed.label,
              category:parsed.category,
              date:{y:today.getFullYear(),m:today.getMonth(),d:today.getDate()},
            };
            await saveEntry(entry);
            btn.className='';btn.textContent='🎤';
            const sign=parsed.type==='income'?'+':parsed.type==='investment'?'↗':'−';
            const cat=CATS[parsed.category]||{icon:'📦'};
            showToast('success',
              `${cat.icon} ${parsed.label}`,
              `${sign}${fmt(parsed.amount)} · ${parsed.category}`
            );
          }catch(err){
            btn.className='';btn.textContent='🎤';
            showToast('error','Save failed. Try again.');
          }
        },400);
      }
    };

    recognition.onerror=(e)=>{
      listening=false;
      btn.className='';btn.textContent='🎤';
      if(e.error==='no-speech')showToast('error','No speech detected. Tap and try again.');
      else if(e.error==='not-allowed')showToast('error','Mic permission denied. Allow in browser settings.');
      else showToast('error','Error: '+e.error);
    };

    recognition.onend=()=>{
      if(listening){listening=false;btn.className='';btn.textContent='🎤';}
    };

    recognition.start();
  });
}

// Initial render
render();
</script>
