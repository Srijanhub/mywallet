<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0D1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MyWallet" />
  <meta name="description" content="Track your daily expenses and income" />
  <title>MyWallet – Expense Tracker</title>

  <!-- PWA Manifest (inline via JS below) -->
  <link rel="manifest" href="#" id="manifest-placeholder" />

  <!-- Icons (SVG data URIs embedded) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%236366F1'/%3E%3Ctext x='96' y='130' text-anchor='middle' font-size='110' font-family='system-ui'%3E💰%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=DM+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:       #0D1117;
      --surface:  #111827;
      --surface2: #1A1F2E;
      --border:   #252B3B;
      --text:     #E2E8F0;
      --muted:    #6B7280;
      --faint:    #374151;
      --accent:   #6366F1;
      --accentL:  #A5B4FC;
      --green:    #22C55E;
      --red:      #EF4444;
      --redL:     #F87171;
      --amber:    #F59E0B;
      --safe:     env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); overscroll-behavior: none; }
    input, button, select { font-family: inherit; }
    input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { -webkit-appearance: none; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ── Layout shells ── */
    #app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; position: relative; }
    #header { background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%); padding: 48px 20px 0; flex-shrink: 0; }
    #tabs { display: flex; gap: 6px; padding: 12px 20px; background: var(--bg); position: sticky; top: 0; z-index: 50; }
    #content { flex: 1; overflow-y: auto; padding: 0 20px; padding-bottom: calc(80px + var(--safe)); }
    #fab { position: fixed; bottom: calc(24px + var(--safe)); right: max(calc(50% - 220px), 16px);
           width: 56px; height: 56px; border-radius: 99px; border: none;
           background: linear-gradient(135deg, var(--accent), #8B5CF6);
           color: #fff; font-size: 28px; cursor: pointer; z-index: 40;
           box-shadow: 0 8px 28px #6366F155; display: flex; align-items: center; justify-content: center;
           transition: transform .15s, box-shadow .15s; }
    #fab:active { transform: scale(.92); box-shadow: 0 4px 12px #6366F133; }

    /* ── Stat cards ── */
    .stat-row { display: flex; gap: 10px; margin-bottom: 14px; }
    .stat-card { flex: 1; min-width: 0; background: var(--surface2); border-radius: 16px; padding: 16px 18px; border: 1px solid var(--border); }
    .stat-label { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
    .stat-value { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 700; }
    .stat-sub { font-size: 10px; color: var(--faint); margin-top: 3px; }

    /* ── Remaining card ── */
    .remaining-card { border-radius: 18px; padding: 18px 20px; margin-bottom: 4px; }
    .remaining-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .remaining-value { font-family: 'DM Mono', monospace; font-size: 32px; font-weight: 800; margin-top: 4px; }
    .progress-bar-bg { height: 6px; background: rgba(0,0,0,.3); border-radius: 99px; margin-top: 12px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 99px; transition: width .6s ease; }

    /* ── Tabs ── */
    .tab { flex: 1; padding: 9px 0; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; font-size: 11px; transition: background .2s, color .2s; }
    .tab.active { background: var(--accent); color: #fff; }
    .tab.inactive { background: var(--surface2); color: var(--muted); }

    /* ── Month nav ── */
    .month-nav { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 14px; }
    .month-nav button { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: #94A3B8; width: 36px; height: 36px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    .month-nav .title { font-weight: 800; font-size: 16px; color: var(--text); }

    /* ── Calendar ── */
    .cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 5px; }
    .cal-dow span { text-align: center; font-size: 9px; color: var(--faint); font-weight: 700; letter-spacing: .5px; padding: 3px 0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 18px; }
    .cal-cell { aspect-ratio: 1; border-radius: 11px; border: 1px solid transparent; cursor: pointer;
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                font-size: 12px; font-weight: 600; color: #CBD5E1; background: var(--surface); transition: all .15s; }
    .cal-cell.empty { background: transparent; cursor: default; border-color: transparent; }
    .cal-cell.today { color: var(--accent); font-weight: 800; background: var(--surface2); }
    .cal-cell.selected { border-color: var(--accent); background: #6366F122; color: var(--accentL); }
    .cal-cell:active:not(.empty) { transform: scale(.92); }
    .cal-dots { display: flex; gap: 2px; margin-top: 2px; }
    .dot { width: 5px; height: 5px; border-radius: 99px; }

    /* ── Day panel ── */
    .day-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .day-panel-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .day-panel-sub { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 7px; }
    .add-btn { background: var(--accent); border: none; border-radius: 10px; color: #fff; font-weight: 700; font-size: 12px; padding: 8px 14px; cursor: pointer; }
    .empty-state { text-align: center; color: var(--faint); font-size: 13px; padding: 28px 0; line-height: 1.8; }

    /* ── Entry row ── */
    .entry-row { display: flex; align-items: center; gap: 11px; padding: 10px 13px; border-radius: 13px; background: var(--surface2); border: 1px solid var(--border); margin-bottom: 7px; }
    .entry-icon { width: 36px; height: 36px; border-radius: 10px; font-size: 17px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .entry-info { flex: 1; min-width: 0; }
    .entry-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry-cat { font-size: 10px; color: var(--faint); margin-top: 2px; }
    .entry-amount { text-align: right; flex-shrink: 0; }
    .entry-val { font-size: 13px; font-weight: 700; font-family: 'DM Mono', monospace; }
    .entry-del { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 10px; padding: 0; margin-top: 3px; display: block; }
    .entry-del:hover { color: var(--red); }

    /* ── Summary ── */
    .summary-card { background: var(--surface2); border-radius: 16px; padding: 18px 16px; margin-bottom: 14px; border: 1px solid var(--border); }
    .summary-card-title { font-size: 12px; font-weight: 700; color: #94A3B8; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .summary-row:last-child { border-bottom: none; }
    .summary-row-label { font-size: 13px; color: var(--muted); }
    .summary-row-val { font-size: 13px; font-weight: 700; font-family: 'DM Mono', monospace; }
    .cat-bar-row { margin-bottom: 12px; }
    .cat-bar-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .cat-bar-bg { height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .cat-bar-fill { height: 100%; border-radius: 99px; transition: width .6s ease; }

    /* ── Modal ── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 200; padding: 0; backdrop-filter: blur(4px); }
    .modal { background: var(--surface); border-radius: 24px 24px 0 0; padding: 24px 22px calc(22px + var(--safe)); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; animation: slideUp .25s ease; }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 99px; margin: 0 auto 20px; }
    .modal-title { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 20px; }
    .type-toggle { display: flex; background: var(--surface2); border-radius: 12px; padding: 4px; margin-bottom: 18px; gap: 4px; }
    .type-btn { flex: 1; padding: 10px 0; border-radius: 9px; border: none; cursor: pointer; font-weight: 700; font-size: 13px; transition: all .2s; }
    .field-label { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; display: block; margin-bottom: 7px; }
    .field-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px; color: var(--text); font-size: 14px; outline: none; transition: border-color .2s; margin-bottom: 14px; }
    .field-input:focus { border-color: var(--accent); }
    .field-input.large { font-size: 22px; font-weight: 700; font-family: 'DM Mono', monospace; }
    .cat-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 22px; }
    .cat-chip { padding: 6px 12px; border-radius: 99px; cursor: pointer; font-size: 11px; font-weight: 700; transition: all .15s; border: 1px solid transparent; }
    .btn-row { display: flex; gap: 10px; }
    .btn-cancel { flex: 1; padding: 13px 0; border-radius: 13px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-weight: 700; font-size: 14px; }
    .btn-save { flex: 2; padding: 13px 0; border-radius: 13px; border: none; color: #fff; cursor: pointer; font-weight: 800; font-size: 15px; transition: transform .1s, opacity .1s; }
    .btn-save:active { transform: scale(.97); opacity: .9; }

    /* ── Offline banner ── */
    #offline-banner { display: none; position: fixed; top: 0; left: 0; right: 0; background: var(--amber); color: #000; font-size: 12px; font-weight: 700; text-align: center; padding: 8px; z-index: 999; }

    /* ── Install banner ── */
    #install-banner { display: none; position: fixed; bottom: calc(90px + var(--safe)); left: max(calc(50% - 220px), 16px); right: max(calc(50% - 220px), 16px);
      background: var(--surface); border: 1px solid var(--accent); border-radius: 16px;
      padding: 14px 16px; z-index: 300; box-shadow: 0 12px 40px #0008; }
    #install-banner p { font-size: 13px; color: var(--text); margin-bottom: 10px; font-weight: 600; }
    #install-banner .ib-row { display: flex; gap: 8px; }
    #install-banner button { flex: 1; padding: 9px 0; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; font-size: 13px; }
    #install-yes { background: var(--accent); color: #fff; }
    #install-no  { background: var(--surface2); color: var(--muted); }
  </style>
</head>
<body>

<div id="offline-banner">⚠️ You're offline — showing saved data</div>
<div id="install-banner">
  <p>📲 Install MyWallet on your home screen for the best experience</p>
  <div class="ib-row">
    <button id="install-yes">Install App</button>
    <button id="install-no">Not now</button>
  </div>
</div>

<div id="app">
  <div id="header"></div>
  <div id="tabs"></div>
  <div id="content"></div>
  <button id="fab">+</button>
</div>

<!-- Modal container -->
<div id="modal-root"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// PWA: Register service worker & manifest
// ─────────────────────────────────────────────────────────────────────────────
const MANIFEST = {
  name: "MyWallet – Expense Tracker",
  short_name: "MyWallet",
  description: "Track your daily expenses and income",
  start_url: "./",
  display: "standalone",
  background_color: "#0D1117",
  theme_color: "#0D1117",
  orientation: "portrait",
  icons: [
    { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%236366F1'/%3E%3Ctext x='96' y='130' text-anchor='middle' font-size='110' font-family='system-ui'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
    { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%236366F1'/%3E%3Ctext x='256' y='350' text-anchor='middle' font-size='300' font-family='system-ui'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E", sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
  ]
};

const blob = new Blob([JSON.stringify(MANIFEST)], { type: 'application/json' });
const mURL = URL.createObjectURL(blob);
document.querySelector('link[rel="manifest"]').href = mURL;

// Service worker (inline as blob)
const SW_CODE = `
const CACHE = 'mywallet-v1';
const ASSETS = ['./', './index.html'];
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys =>
    Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
  ));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  e.respondWith(
    caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match('./index.html')))
  );
});
`;
if ('serviceWorker' in navigator) {
  const swBlob = new Blob([SW_CODE], { type: 'application/javascript' });
  const swURL  = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swURL, { scope: './' })
    .then(() => console.log('[SW] registered'))
    .catch(e => console.warn('[SW] failed:', e));
}

// Offline detection
window.addEventListener('offline', () => document.getElementById('offline-banner').style.display = 'block');
window.addEventListener('online',  () => document.getElementById('offline-banner').style.display = 'none');

// Install prompt
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.getElementById('install-banner');
  banner.style.display = 'block';
  document.getElementById('install-yes').onclick = async () => {
    banner.style.display = 'none';
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  };
  document.getElementById('install-no').onclick = () => { banner.style.display = 'none'; };
});

// ─────────────────────────────────────────────────────────────────────────────
// Data & State
// ─────────────────────────────────────────────────────────────────────────────
const CATS = {
  Food:      { icon: '🍔', color: '#F97316' },
  Transport: { icon: '🚗', color: '#3B82F6' },
  Shopping:  { icon: '🛍️', color: '#A855F7' },
  Health:    { icon: '💊', color: '#10B981' },
  Bills:     { icon: '📋', color: '#EF4444' },
  Housing:   { icon: '🏠', color: '#6366F1' },
  Fun:       { icon: '🎉', color: '#F59E0B' },
  Savings:   { icon: '💰', color: '#14B8A6' },
  Income:    { icon: '💵', color: '#22C55E' },
  Other:     { icon: '📦', color: '#94A3B8' },
};
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmt    = n => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);

function loadData(key, def) {
  try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : def; } catch { return def; }
}
function saveData(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

const now = new Date();
let state = {
  curY:    now.getFullYear(),
  curM:    now.getMonth(),
  selDay:  now.getDate(),
  view:    'calendar',
  entries: loadData('xtrack_entries', []),
  budget:  loadData('xtrack_budget', 0),
  modal:   null,   // null | 'add' | 'budget'
};

function setState(patch) {
  Object.assign(state, patch);
  render();
}

// ─────────────────────────────────────────────────────────────────────────────
// Derived
// ─────────────────────────────────────────────────────────────────────────────
function monthEntries() {
  return state.entries.filter(e => e.date.y === state.curY && e.date.m === state.curM);
}
function dayEntries(d) {
  return monthEntries().filter(e => e.date.d === d);
}
function dayNet(d) {
  const es = dayEntries(d);
  return {
    inc:   es.filter(e => e.type === 'income').reduce((s,e) => s+e.amount, 0),
    exp:   es.filter(e => e.type === 'expense').reduce((s,e) => s+e.amount, 0),
    count: es.length,
  };
}
function totals() {
  const me = monthEntries();
  const inc = me.filter(e => e.type === 'income').reduce((s,e) => s+e.amount, 0);
  const exp = me.filter(e => e.type === 'expense').reduce((s,e) => s+e.amount, 0);
  return { inc, exp, net: inc - exp };
}

function addEntry(entry) {
  state.entries = [...state.entries, entry];
  saveData('xtrack_entries', state.entries);
  setState({ modal: null });
}
function deleteEntry(id) {
  state.entries = state.entries.filter(e => e.id !== id);
  saveData('xtrack_entries', state.entries);
  render();
}
function setBudget(val) {
  state.budget = val;
  saveData('xtrack_budget', val);
  setState({ modal: null });
}

// ─────────────────────────────────────────────────────────────────────────────
// Render helpers
// ─────────────────────────────────────────────────────────────────────────────
function el(tag, attrs, ...children) {
  const elem = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === 'style' && typeof v === 'object') Object.assign(elem.style, v);
    else if (k.startsWith('on')) elem.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'class') elem.className = v;
    else elem.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c === null || c === undefined) return;
    elem.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return elem;
}
function div(cls, style, ...children) {
  return el('div', { class: cls, style: style || {} }, ...children);
}

function entryRowEl(entry) {
  const cat = CATS[entry.category] || CATS.Other;
  const isIncome = entry.type === 'income';
  const row = div('entry-row', null,
    div('entry-icon', { background: cat.color + '22' }, cat.icon),
    div('entry-info', null,
      div('entry-name', null, entry.label || entry.category),
      div('entry-cat', null, entry.category)
    ),
    div('entry-amount', null,
      el('div', { class: 'entry-val', style: { color: isIncome ? '#22C55E' : '#F87171' } },
        (isIncome ? '+' : '−') + fmt(entry.amount)
      ),
      el('button', { class: 'entry-del', onClick: () => deleteEntry(entry.id) }, '✕ remove')
    )
  );
  return row;
}

// ─────────────────────────────────────────────────────────────────────────────
// Header render
// ─────────────────────────────────────────────────────────────────────────────
function renderHeader() {
  const hdr = document.getElementById('header');
  hdr.innerHTML = '';
  const { inc, exp } = totals();
  const remaining  = (state.budget || inc) - exp;
  const pct        = state.budget ? Math.min((exp / state.budget) * 100, 100) : 0;
  const positive   = remaining >= 0;

  // Top bar
  const topBar = div('', { display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'18px' },
    div('', null,
      el('div', { style: { fontSize:'10px', color:'#4B5563', fontWeight:'700', textTransform:'uppercase', letterSpacing:'2px' } }, 'Expense Tracker'),
      el('div', { style: { fontSize:'22px', fontWeight:'800', color:'#F1F5F9', marginTop:'3px' } }, '💼 MyWallet')
    ),
    el('button', {
      style: { background:'#1A1F2E', border:'1px solid #252B3B', borderRadius:'11px', color:'#94A3B8', fontSize:'11px', fontWeight:'700', padding:'8px 13px', cursor:'pointer' },
      onClick: () => setState({ modal: 'budget' })
    }, '⚙ Budget')
  );

  // Stat cards
  const statRow = div('stat-row', null,
    (() => {
      const c = div('stat-card', { borderColor: '#22C55E33', boxShadow: '0 0 20px #22C55E12' });
      c.innerHTML = `<div class="stat-label"><span>💵</span> Earned</div><div class="stat-value" style="color:#22C55E">${fmt(inc)}</div><div class="stat-sub">${monthEntries().filter(e=>e.type==='income').length} entries</div>`;
      return c;
    })(),
    (() => {
      const c = div('stat-card', { borderColor: '#EF444433', boxShadow: '0 0 20px #EF444412' });
      c.innerHTML = `<div class="stat-label"><span>💸</span> Spent</div><div class="stat-value" style="color:#F87171">${fmt(exp)}</div><div class="stat-sub">${monthEntries().filter(e=>e.type==='expense').length} entries</div>`;
      return c;
    })()
  );

  // Remaining card
  const remCard = div('remaining-card', {
    background: positive ? 'linear-gradient(135deg,#052e16,#14532d)' : 'linear-gradient(135deg,#450a0a,#7f1d1d)',
    border: `1px solid ${positive ? '#166534' : '#991b1b'}`,
    marginBottom: '4px',
  });
  const labelEl = el('div', { class: 'remaining-label', style: { color: positive ? '#4ADE80' : '#FCA5A5' } },
    positive ? '💰 Available to spend' : '⚠️ Over budget'
  );
  const valEl = el('div', { class: 'remaining-value', style: { color: positive ? '#4ADE80' : '#FCA5A5' } },
    fmt(Math.abs(remaining))
  );
  remCard.appendChild(labelEl);
  remCard.appendChild(valEl);
  if (state.budget > 0) {
    const pbMeta = div('', { display:'flex', justifyContent:'space-between', fontSize:'10px', color:'#6B7280', marginTop:'12px', marginBottom:'5px' },
      el('span', null, 'Budget used'),
      el('span', null, pct.toFixed(0) + '%')
    );
    const pbBg = div('progress-bar-bg', null);
    const pbFill = div('progress-bar-fill', {
      width: pct + '%',
      background: pct > 90 ? '#EF4444' : pct > 70 ? '#F59E0B' : '#22C55E',
    });
    pbBg.appendChild(pbFill);
    remCard.appendChild(pbMeta);
    remCard.appendChild(pbBg);
  }

  hdr.appendChild(topBar);
  hdr.appendChild(statRow);
  hdr.appendChild(remCard);
}

// ─────────────────────────────────────────────────────────────────────────────
// Tabs render
// ─────────────────────────────────────────────────────────────────────────────
function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  [['calendar','📅 Calendar'],['list','📋 Log'],['summary','📊 Summary']].forEach(([v, lbl]) => {
    const btn = el('button', {
      class: 'tab ' + (state.view === v ? 'active' : 'inactive'),
      onClick: () => setState({ view: v })
    }, lbl);
    tabs.appendChild(btn);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Calendar view
// ─────────────────────────────────────────────────────────────────────────────
function renderCalendar(container) {
  const { curY, curM, selDay } = state;
  const daysInMonth = new Date(curY, curM + 1, 0).getDate();
  const firstDow    = new Date(curY, curM, 1).getDay();
  const todayD      = now.getDate(), todayM = now.getMonth(), todayY = now.getFullYear();

  // Month nav
  const nav = div('month-nav', null,
    el('button', { onClick: () => {
      if (state.curM === 0) setState({ curY: state.curY-1, curM: 11, selDay: 1 });
      else setState({ curM: state.curM-1, selDay: 1 });
    }}, '‹'),
    el('div', { class: 'title' }, MONTHS[curM] + ' ' + curY),
    el('button', { onClick: () => {
      if (state.curM === 11) setState({ curY: state.curY+1, curM: 0, selDay: 1 });
      else setState({ curM: state.curM+1, selDay: 1 });
    }}, '›')
  );
  container.appendChild(nav);

  // DOW headers
  const dowRow = div('cal-dow', null, ...DAYS.map(d => el('span', null, d)));
  container.appendChild(dowRow);

  // Grid
  const grid = div('cal-grid', null);
  for (let i = 0; i < firstDow; i++) {
    grid.appendChild(div('cal-cell empty', null));
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const { inc, exp, count } = dayNet(d);
    const isToday = d === todayD && curM === todayM && curY === todayY;
    const isSel   = d === selDay;
    let cls = 'cal-cell';
    if (isToday) cls += ' today';
    if (isSel)   cls += ' selected';
    const cell = el('button', { class: cls, onClick: () => setState({ selDay: d }) },
      el('span', null, String(d))
    );
    if (count > 0) {
      const dots = div('cal-dots', null);
      if (exp > 0) dots.appendChild(div('dot', { background: '#EF4444' }));
      if (inc > 0) dots.appendChild(div('dot', { background: '#22C55E' }));
      cell.appendChild(dots);
    }
    grid.appendChild(cell);
  }
  container.appendChild(grid);

  // Day panel
  const des = dayEntries(selDay);
  const panelHdr = div('day-panel-header', null,
    el('div', null,
      el('span', { class: 'day-panel-title' }, MONTHS[curM] + ' ' + selDay + ', ' + curY),
      el('span', { class: 'day-panel-sub' }, des.length + ' entr' + (des.length === 1 ? 'y' : 'ies'))
    ),
    el('button', { class: 'add-btn', onClick: () => setState({ modal: 'add' }) }, '+ Add')
  );
  container.appendChild(panelHdr);

  if (des.length === 0) {
    container.appendChild(el('div', { class: 'empty-state' }, 'No entries for this day.\nTap + Add to log one.'));
  } else {
    des.forEach(e => container.appendChild(entryRowEl(e)));
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Log view
// ─────────────────────────────────────────────────────────────────────────────
function renderLog(container) {
  const { curY, curM } = state;
  const daysInMonth = new Date(curY, curM + 1, 0).getDate();

  // Month nav
  const nav = div('month-nav', null,
    el('button', { onClick: () => {
      if (state.curM === 0) setState({ curY: state.curY-1, curM: 11, selDay: 1 });
      else setState({ curM: state.curM-1, selDay: 1 });
    }}, '‹'),
    el('div', { class: 'title' }, MONTHS[curM] + ' ' + curY),
    el('button', { onClick: () => {
      if (state.curM === 11) setState({ curY: state.curY+1, curM: 0, selDay: 1 });
      else setState({ curM: state.curM+1, selDay: 1 });
    }}, '›')
  );
  container.appendChild(nav);

  const hdrRow = div('', { display:'flex', justifyContent:'flex-end', marginBottom:'14px' },
    el('button', { class: 'add-btn', onClick: () => setState({ modal: 'add' }) }, '+ Add Entry')
  );
  container.appendChild(hdrRow);

  const me = monthEntries().slice().sort((a,b) => b.date.d - a.date.d);
  if (me.length === 0) {
    container.appendChild(el('div', { class: 'empty-state' }, 'No entries this month yet.'));
    return;
  }
  // Group by day
  const byDay = {};
  me.forEach(e => {
    if (!byDay[e.date.d]) byDay[e.date.d] = [];
    byDay[e.date.d].push(e);
  });
  Object.keys(byDay).sort((a,b) => b-a).forEach(d => {
    const dayLabel = el('div', { style: { fontSize:'11px', fontWeight:'700', color:'#4B5563', textTransform:'uppercase', letterSpacing:'1px', marginBottom:'7px', marginTop:'14px' } },
      MONTHS[curM].slice(0,3) + ' ' + d
    );
    container.appendChild(dayLabel);
    byDay[d].forEach(e => container.appendChild(entryRowEl(e)));
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Summary view
// ─────────────────────────────────────────────────────────────────────────────
function renderSummary(container) {
  const { curY, curM } = state;
  const daysInMonth = new Date(curY, curM + 1, 0).getDate();

  // Month nav
  const nav = div('month-nav', null,
    el('button', { onClick: () => {
      if (state.curM === 0) setState({ curY: state.curY-1, curM: 11, selDay: 1 });
      else setState({ curM: state.curM-1, selDay: 1 });
    }}, '‹'),
    el('div', { class: 'title' }, MONTHS[curM] + ' ' + curY),
    el('button', { onClick: () => {
      if (state.curM === 11) setState({ curY: state.curY+1, curM: 0, selDay: 1 });
      else setState({ curM: state.curM+1, selDay: 1 });
    }}, '›')
  );
  container.appendChild(nav);

  const { inc, exp, net } = totals();

  // Overview card
  const overCard = div('summary-card', null,
    el('div', { class: 'summary-card-title' }, 'Month Overview')
  );
  [
    { label: 'Total Income',   val: inc,             color: '#22C55E' },
    { label: 'Total Expenses', val: exp,             color: '#F87171' },
    { label: 'Net Balance',    val: net,             color: net >= 0 ? '#4ADE80' : '#FCA5A5' },
    ...(state.budget ? [{ label: 'Monthly Budget', val: state.budget, color: '#6366F1' }] : []),
  ].forEach(r => {
    const row = div('summary-row', null,
      el('span', { class: 'summary-row-label' }, r.label),
      el('span', { class: 'summary-row-val', style: { color: r.color } }, fmt(r.val))
    );
    overCard.appendChild(row);
  });
  container.appendChild(overCard);

  // Category breakdown
  const catData = Object.keys(CATS).map(cat => ({
    cat,
    total: monthEntries().filter(e => e.category === cat && e.type === 'expense').reduce((s,e) => s+e.amount, 0),
  })).filter(x => x.total > 0).sort((a,b) => b.total - a.total);

  if (catData.length > 0) {
    const catCard = div('summary-card', null,
      el('div', { class: 'summary-card-title' }, 'Spending by Category')
    );
    catData.forEach(({ cat, total }) => {
      const pct = exp > 0 ? (total / exp) * 100 : 0;
      const c   = CATS[cat];
      const row = div('cat-bar-row', null,
        div('cat-bar-header', null,
          el('span', { style: { fontSize:'13px', color:'#CBD5E1' } }, c.icon + ' ' + cat),
          el('span', { style: { fontSize:'12px', fontWeight:'700', color: c.color, fontFamily:"'DM Mono',monospace" } }, fmt(total))
        ),
        div('cat-bar-bg', null,
          div('cat-bar-fill', { width: pct + '%', background: c.color })
        )
      );
      catCard.appendChild(row);
    });
    container.appendChild(catCard);
  }

  // Daily activity
  const activeDays = Array.from({ length: daysInMonth }, (_,i) => i+1)
    .filter(d => dayNet(d).count > 0).reverse();

  if (activeDays.length > 0) {
    const dayCard = div('summary-card', null,
      el('div', { class: 'summary-card-title' }, 'Daily Activity')
    );
    activeDays.forEach(d => {
      const { inc: dInc, exp: dExp } = dayNet(d);
      const row = div('summary-row', null,
        el('button', {
          style: { background:'none', border:'none', color:'#6366F1', cursor:'pointer', fontSize:'13px', fontWeight:'700', padding:0 },
          onClick: () => setState({ selDay: d, view: 'calendar' })
        }, MONTHS[curM].slice(0,3) + ' ' + d),
        div('', { display:'flex', gap:'12px' },
          ...(dInc > 0 ? [el('span', { style: { fontSize:'12px', color:'#22C55E', fontFamily:"'DM Mono',monospace" } }, '+' + fmt(dInc))] : []),
          ...(dExp > 0 ? [el('span', { style: { fontSize:'12px', color:'#F87171', fontFamily:"'DM Mono',monospace" } }, '−' + fmt(dExp))] : [])
        )
      );
      dayCard.appendChild(row);
    });
    container.appendChild(dayCard);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Modals
// ─────────────────────────────────────────────────────────────────────────────
function renderAddModal() {
  let type = 'expense', amount = '', label = '', category = 'Food';
  const { curY, curM, selDay } = state;

  const overlay = div('overlay', null);
  const modal   = div('modal', null);

  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

  const handle = div('modal-handle', null);
  const title  = el('div', { class: 'modal-title' }, '📝 Log Entry — ' + MONTHS[curM] + ' ' + selDay);

  // Type toggle
  const toggleWrap = div('type-toggle', null);
  const updateToggle = () => {
    toggleWrap.innerHTML = '';
    ['expense','income'].forEach(t => {
      const b = el('button', {
        class: 'type-btn',
        style: {
          background: type === t ? (t==='income' ? '#22C55E' : '#EF4444') : 'transparent',
          color: type === t ? '#fff' : '#6B7280',
        },
        onClick: () => {
          type = t;
          category = t === 'income' ? 'Income' : 'Food';
          updateToggle();
          updateCats();
        }
      }, t === 'expense' ? '💸 Expense' : '💵 Income');
      toggleWrap.appendChild(b);
    });
  };
  updateToggle();

  // Amount
  const amtLabel = el('label', { class: 'field-label' }, 'Amount ($)');
  const amtInput = el('input', { class: 'field-input large', type: 'number', placeholder: '0.00', min: '0', step: '0.01' });
  amtInput.addEventListener('input', e => amount = e.target.value);

  // Label
  const lblLabel = el('label', { class: 'field-label' }, 'Description');
  const lblInput = el('input', { class: 'field-input', type: 'text', placeholder: 'e.g. Lunch at Subway' });
  lblInput.addEventListener('input', e => label = e.target.value);

  // Category chips
  const catLabel = el('label', { class: 'field-label' }, 'Category');
  const catWrap  = div('cat-chips', null);

  const updateCats = () => {
    catWrap.innerHTML = '';
    Object.entries(CATS).forEach(([k, v]) => {
      const isIncome = type === 'income';
      const show = isIncome ? ['Income','Savings','Other'].includes(k) : k !== 'Income';
      if (!show) return;
      const chip = el('button', {
        class: 'cat-chip',
        style: {
          background: category === k ? v.color + '33' : '#1A1F2E',
          borderColor: category === k ? v.color : '#252B3B',
          color: category === k ? v.color : '#6B7280',
        },
        onClick: () => { category = k; updateCats(); }
      }, v.icon + ' ' + k);
      catWrap.appendChild(chip);
    });
  };
  updateCats();

  // Buttons
  const btnRow = div('btn-row', null,
    el('button', { class: 'btn-cancel', onClick: closeModal }, 'Cancel'),
    el('button', {
      class: 'btn-save',
      style: { background: type === 'income' ? '#22C55E' : '#EF4444' },
      onClick: () => {
        const n = parseFloat(amtInput.value);
        if (!n || n <= 0) { amtInput.style.borderColor = '#EF4444'; return; }
        addEntry({ id: Date.now(), type, amount: n, label: lblInput.value, category, date: { y: curY, m: curM, d: selDay } });
      }
    }, 'Save Entry')
  );

  // Update save button color on type change
  const origUpdateToggle = updateToggle;

  modal.append(handle, title, toggleWrap, amtLabel, amtInput, lblLabel, lblInput, catLabel, catWrap, btnRow);
  overlay.appendChild(modal);
  document.getElementById('modal-root').appendChild(overlay);

  setTimeout(() => amtInput.focus(), 300);
  return overlay;
}

function renderBudgetModal() {
  const overlay = div('overlay', null);
  const modal   = div('modal', null);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

  modal.append(
    div('modal-handle', null),
    el('div', { class: 'modal-title' }, '📊 Monthly Budget'),
    el('div', { style: { fontSize:'13px', color:'#6B7280', marginBottom:'18px' } }, 'Set a spending limit. Leave 0 to use your income as the baseline.'),
    el('label', { class: 'field-label' }, 'Budget Amount ($)'),
    (() => {
      const inp = el('input', { class: 'field-input large', type: 'number', placeholder: 'e.g. 2000', min: '0' });
      inp.value = state.budget || '';
      inp.id = 'budget-input';
      return inp;
    })(),
    div('btn-row', null,
      el('button', { class: 'btn-cancel', onClick: closeModal }, 'Cancel'),
      el('button', { class: 'btn-save', style: { background: '#6366F1' }, onClick: () => {
        const v = parseFloat(document.getElementById('budget-input').value) || 0;
        setBudget(v);
      }}, 'Set Budget')
    )
  );
  overlay.appendChild(modal);
  document.getElementById('modal-root').appendChild(overlay);
}

function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
  state.modal = null;
}

// ─────────────────────────────────────────────────────────────────────────────
// Main render
// ─────────────────────────────────────────────────────────────────────────────
function render() {
  renderHeader();
  renderTabs();

  const content = document.getElementById('content');
  content.innerHTML = '';
  if      (state.view === 'calendar') renderCalendar(content);
  else if (state.view === 'list')     renderLog(content);
  else if (state.view === 'summary')  renderSummary(content);

  document.getElementById('modal-root').innerHTML = '';
  if (state.modal === 'add')    renderAddModal();
  if (state.modal === 'budget') renderBudgetModal();
}

// FAB
document.getElementById('fab').addEventListener('click', () => setState({ modal: 'add' }));

// Initial render
render();
</script>
</body>
